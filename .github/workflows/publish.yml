name: Publish QuietWorld update
on:
  push:
    branches: [main]
    paths: [QuietWorld_Source_5.9.0.zip, release.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quietworld-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import initial verified source archive
        run: |
          if [ ! -f go.mod ]; then
            echo '884c60dab2cb5ae9ed45212e20930ff469511ed02ee5385e13fe343ef1aa9848  QuietWorld_Source_5.9.0.zip' | sha256sum -c -
            unzip -q QuietWorld_Source_5.9.0.zip
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: python3 scripts/publish.py
      - name: Publish verified files
        run: |
          git add .gitignore go.mod release.json game/ scripts/ tests/ setup/main.go updates/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish QuietWorld update'
          git push origin HEAD:main
